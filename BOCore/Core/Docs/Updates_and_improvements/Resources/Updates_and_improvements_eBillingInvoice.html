        body {
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background-color: #1e293b;
            padding: 1rem;
            border-right: 1px solid #334155;
            overflow-y: auto;
        }

            .sidebar h3 {
                font-size: 1.1rem;
                margin-bottom: 1rem;
            }

        .toggle-header {
            cursor: pointer;
            display: flex;
            align-items: center;
            color: #94a3b8;
            font-weight: bold;
            margin-top: 1rem;
            user-select: none;
        }

        .toggle-icon {
            margin-right: 6px;
            transition: transform 0.3s ease;
        }

            .toggle-icon.rotated {
                transform: rotate(90deg);
            }

        .release-list {
            list-style: none;
            padding-left: 1rem;
            margin: 0.5rem 0;
            display: none;
        }

            .release-list li {
                margin: 4px 0;
            }

        .sidebar a {
            text-decoration: none;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

            .sidebar a:hover {
                color: #38bdf8;
            }

        .content {
            flex: 1;
            padding: 2rem;
        }

        h1, h2 {
            color: #f8fafc;
        }

        .date {
            color: #cbd5e1;
        }

        .section-title {
            font-size: 1.25rem;
            margin-top: 1.5rem;
            border-left: 4px solid #38bdf8;
            padding-left: 0.5rem;
            margin-left: 1rem;
        }

            /* Estilo específico para la sección de correcciones */
            .section-title:has(+ div h4) {
                border-left-color: #f87171;
            }

        /* Color rojo para el contenido de correcciones */
        .fixes {
            color: #f87171 !important;
        }

            .fixes li.indented-text {
                color: #f87171 !important;
            }

        h4 {
            margin-top: 1rem;
            margin-left: 2rem;
            font-weight: bold;
            color: #94a3b8;
        }

        ul.release-notes {
            list-style-type: none !important; /* Asegurarse de eliminar los puntos por defecto */
            padding-left: 3rem;
            margin: 0.5rem 0;
            text-indent: 0 !important; /* Asegurarse de eliminar la indentación de texto */
        }

            ul.release-notes li {
                padding-left: 0 !important; /* Ajustar el padding del item */
                margin-bottom: 0.5rem;
                text-indent: 0 !important; /* Asegurarse de eliminar la indentación de texto */
            }

        .indented-text {
            padding-left: 3rem !important;
            text-indent: 0 !important; /* Asegurarse de eliminar la indentación de texto */
        }

        .indented-image {
            padding-left: 3rem !important;
        }

        ul.release-notes li::before {
            display: none !important; /* Asegurarse de ocultar los puntos personalizados */
        }

        .fixes li::before {
            display: none !important; /* Asegurarse de ocultar los puntos personalizados */
        }

        .fixes li {
            color: #f87171 !important; /* Color rojo para el texto de correcciones */
        }
    </style>

    function toggleList(listId, headerElement) {
      const list = document.getElementById(listId);
      const icon = headerElement.querySelector('.toggle-icon');
      const isVisible = list.style.display === 'block';
      list.style.display = isVisible ? 'none' : 'block';
      icon.classList.toggle('rotated', !isVisible);
    }

    function createSidebar() {
      const sidebar = document.getElementById('sidebar');
      const years = Object.keys(releasesData.releases).sort((a, b) => b - a);

      years.forEach(year => {
        const header = document.createElement('div');
        header.className = 'toggle-header';
        header.setAttribute('onclick', `toggleList('list${year}', this)`);
        header.innerHTML = `<span class="toggle-icon">▶</span> ${year}`;
        sidebar.appendChild(header);

        const ul = document.createElement('ul');
        ul.id = `list${year}`;
        ul.className = 'release-list';

        releasesData.releases[year].forEach(release => {
          const li = document.createElement('li');
          li.innerHTML = `<a href="#" onclick="renderRelease('${year}', '${release.version}')">Version ${release.version}</a>`;
          ul.appendChild(li);
        });

        sidebar.appendChild(ul);
      });
    }

    function renderRelease(year, version) {
      const container = document.getElementById('release-content');
      const release = releasesData.releases[year].find(r => r.version === version);

      container.innerHTML = `
        <p class="date">${release.date}</p>
        <h2>Version ${release.version}</h2>
      `;

      if (release.improvements) {
        for (const section in release.improvements) {
          container.innerHTML += `<div class="section-title" style="border-left-color: #38bdf8; color: #38bdf8;">${section} 📢</div>`;
          for (const subsection in release.improvements[section]) {
            container.innerHTML += `<h4>${subsection}</h4><ul class="release-notes">`;
            release.improvements[section][subsection].forEach(note => {
              let listItem;
              if (!note.includes('<img')) {
                listItem = `<li class="indented-text">${note}</li>`;
              } else {
                listItem = `<li class="indented-image">${note}</li>`;
              }
              container.innerHTML += listItem;
            });
            container.innerHTML += `</ul>`;
          }
        }
      }

      if (release.fixes) {
        for (const section in release.fixes) {
          container.innerHTML += `<div class="section-title" style="border-left-color: #f87171; color: #f87171;">${section} 🛠️</div>`;
          for (const subsection in release.fixes[section]) {
            container.innerHTML += `<h4>${subsection}</h4><ul class="release-notes fixes">`;
            release.fixes[section][subsection].forEach(note => {
              let listItem;
              if (!note.includes('<img')) {
                listItem = `<li class="indented-text">${note}</li>`;
              } else {
                listItem = `<li class="indented-image">${note}</li>`;
              }
              container.innerHTML += listItem;
            });
            container.innerHTML += `</ul>`;
          }
        }
      }
    }

    createSidebar();
    const latestYear = Object.keys(releasesData.releases).sort((a, b) => b - a)[0];
    const latestVersion = releasesData.releases[latestYear][0].version;
    renderRelease(latestYear, latestVersion);
